# Render Blueprint for the Vastra FastAPI backend.
# Secrets are not stored here. Set NEBIUS_API_KEY in the Render dashboard or via the API.
# SECRET_KEY is generated by Render (generateValue) and is not taken from .env.example.

services:
  - type: web
    name: vastra-api
    runtime: python
    plan: starter
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn vastra.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: vastra-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: DATABASE_URL
        value: sqlite:////data/vastra.db
      - key: SECRET_KEY
        generateValue: true
      - key: NEBIUS_API_KEY
        sync: false
      - key: NEBIUS_BASE_URL
        value: https://api.tokenfactory.nebius.com/v1/
      - key: NEMOTRON_MODEL
        value: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B
      - key: STYLIST_MODEL
        value: nvidia/nemotron-3-super-120b-a12b
      - key: NEMOTRON_TIMEOUT_SECONDS
        value: "60"
